name: Keep Render awake

# The bot runs in polling mode on Render's free plan, which spins the service down after
# ~15 minutes without HTTP requests; a sleeping service does not poll Telegram, so the bot
# goes silent. Pinging /health keeps it awake. GitHub's cron is best effort; for a firmer
# guarantee also add a ping from an external monitor (UptimeRobot / cron-job.org).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 120 --retry 3 --retry-delay 10 https://telegram-programmer-bot.onrender.com/health
